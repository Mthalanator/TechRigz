<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechRigz - Shopping Cart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="images/logo.svg" alt="TechRigz Logo" class="logo-img">
      <span class="logo-text">TechRigz</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="games.html">Top 10 Games</a>
      <a href="cart.html" class="active">Cart (<span id="cart-count">0</span>)</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="container">
    <h1 class="page-title">Your Shopping Cart</h1>

    <div id="cart-items-container" class="card" style="margin-bottom: 2rem;">
      <!-- Dynamic Cart Content Rendered by JavaScript -->
    </div>

    <div class="card" style="text-align: right;">
      <h2 style="color: var(--text-light);">Total Amount: <span id="cart-total" class="price">R 0</span></h2>
      <a href="contact.html" class="btn" style="margin-top: 1rem;">Proceed to Purchase Inquiry</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 TechRigz Pietermaritzburg. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script>
    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const totalElem = document.getElementById('cart-total');
      
      if (!cart || cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">Your cart is currently empty.</p>';
        totalElem.textContent = 'R 0';
        return;
      }

      let html = '<table class="cart-table">';
      html += '<tr><th>Item</th><th>Qty</th><th>Price</th><th>Action</th></tr>';
      
      let total = 0;
      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `<tr>
          <td style="font-weight: bold;">${item.name}</td>
          <td>${item.quantity}</td>
          <td>R ${itemTotal.toLocaleString()}</td>
          <td><button onclick="removeFromCart(${index})" class="btn btn-danger">Remove</button></td>
        </tr>`;
      });
      
      html += '</table>';
      container.innerHTML = html;
      totalElem.textContent = `R ${total.toLocaleString()}`;
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
