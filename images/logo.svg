<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Outer Tech Shield / Frame -->
  <polygon points="250,40 420,120 420,380 250,460 80,380 80,120" fill="none" stroke="#00f0ff" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="250,65 395,135 395,365 250,435 105,365 105,135" fill="none" stroke="#1c2541" stroke-width="6" opacity="0.8"/>

  <!-- Circuit Corner Accents -->
  <circle cx="250" cy="40" r="8" fill="#00f0ff"/>
  <circle cx="420" cy="120" r="8" fill="#00f0ff"/>
  <circle cx="420" cy="380" r="8" fill="#00f0ff"/>
  <circle cx="250" cy="460" r="8" fill="#00f0ff"/>
  <circle cx="80" cy="380" r="8" fill="#00f0ff"/>
  <circle cx="80" cy="120" r="8" fill="#00f0ff"/>

  <!-- Central 'TR' Gaming Rig Icon -->
  <path d="M 160 160 H 340 M 250 160 V 320" stroke="#00f0ff" stroke-width="22" stroke-linecap="round"/>
  <path d="M 250 230 H 320 Q 350 230 350 260 Q 350 290 320 290 H 250" fill="none" stroke="#00f0ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 290 290 L 340 350" stroke="#00f0ff" stroke-width="22" stroke-linecap="round"/>

  <!-- Tech Ring HUD Element -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="#00f0ff" stroke-width="4" stroke-dasharray="20 15"/>

  <!-- Brand Typography -->
  <text x="250" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">TECHRIGZ</text>
</svg>
